<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة مريض - سَنَد | Sanad</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/9QK3SShV/Icon-Logo.jpg">
    <style>
        /* ===== BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        body.en {
            direction: ltr;
        }
        body.ar {
            direction: rtl;
        }

        .container {
            max-width: 560px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 2rem;
            font-weight: 700;
            color: #1a2a3a;
        }
        .brand-name span {
            color: #d32f2f;
        }

        .subhead {
            font-size: 1.1rem;
            color: #4a5b6b;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: start;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a2a3a;
        }

        input[type="text"],
        input[type="tel"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d1d9e6;
            border-radius: 16px;
            font-size: 1rem;
            transition: border 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #2c3e50;
            box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #2c3e50;
            color: white;
            min-height: 56px;
        }

        .btn:hover {
            background: #1a2a3a;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 42, 58, 0.3);
        }

        .btn-success {
            background: #2e7d32;
        }
        .btn-success:hover {
            background: #1b5e20;
        }

        .lang-toggle {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .lang-btn {
            background: none;
            border: 2px solid #d1d9e6;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5b6b;
        }

        .lang-btn.active {
            background: #1a2a3a;
            color: white;
            border-color: #1a2a3a;
        }

        .message {
            margin-top: 16px;
            padding: 12px;
            border-radius: 12px;
            font-weight: 500;
            min-height: 40px;
        }

        .message-success {
            background: #e8f5e9;
            color: #1b5e20;
        }

        .message-error {
            background: #ffebee;
            color: #c62828;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4a5b6b;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        .patient-data {
            margin-top: 24px;
            padding: 20px;
            background: #f8fafc;
            border-radius: 16px;
            text-align: start;
            display: none;
        }

        .patient-data.visible {
            display: block;
        }

        .patient-data p {
            margin: 6px 0;
            font-size: 0.95rem;
        }

        .patient-data strong {
            color: #1a2a3a;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
            .brand-name {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand -->
        <div class="brand">
            <img src="https://i.postimg.cc/k4P0MbGy/Primary-Logo.jpg" alt="Sanad Logo" class="brand-logo">
            <h1 class="brand-name">سَنَد <span>|</span> Sanad</h1>
        </div>

        <!-- Language Toggle -->
        <div class="lang-toggle" role="group" aria-label="Language selector">
            <button class="lang-btn active" data-lang="ar" aria-pressed="true">العربية</button>
            <button class="lang-btn" data-lang="en" aria-pressed="false">English</button>
        </div>

        <p class="subhead" id="subhead">أدخل بياناتك وكود المتابعة للربط مع مريض</p>

        <!-- Form -->
        <form id="followForm" novalidate>
            <div class="form-group">
                <label id="nameLabel">الاسم الكامل</label>
                <input type="text" id="fullName" name="fullName" required aria-required="true">
            </div>

            <div class="form-group">
                <label id="phoneLabel">رقم الهاتف</label>
                <input type="tel" id="phone" name="phone" required aria-required="true">
            </div>

            <div class="form-group">
                <label id="codeLabel">كود المتابعة</label>
                <input type="text" id="followCode" name="followCode" placeholder="مثال: SANAD-XXXXXX" required aria-required="true">
            </div>

            <button type="submit" class="btn" id="submitBtn">ربط</button>
        </form>

        <div id="message" class="message"></div>

        <!-- Patient Data Display -->
        <div id="patientData" class="patient-data">
            <h4 id="patientDataTitle">بيانات المريض</h4>
            <p><strong id="pdNameLabel">الاسم:</strong> <span id="pdName">—</span></p>
            <p><strong id="pdAgeLabel">العمر:</strong> <span id="pdAge">—</span></p>
            <p><strong id="pdGenderLabel">الجنس:</strong> <span id="pdGender">—</span></p>
            <p><strong id="pdMedLabel">العلاج:</strong> <span id="pdMed">—</span></p>
            <p><strong id="pdPhoneLabel">الهاتف:</strong> <span id="pdPhone">—</span></p>
            <p><strong id="pdBloodLabel">فصيلة الدم:</strong> <span id="pdBlood">—</span></p>
            <p><strong id="pdAddressLabel">العنوان:</strong> <span id="pdAddress">—</span></p>
        </div>

        <a href="/" class="back-link" id="backLink">← العودة للرئيسية</a>
    </div>

    <script>
        // =============================================
        // TRANSLATIONS
        // =============================================
        const translations = {
            ar: {
                title: 'متابعة مريض - سَنَد | Sanad',
                subhead: 'أدخل بياناتك وكود المتابعة للربط مع مريض',
                name: 'الاسم الكامل',
                phone: 'رقم الهاتف',
                code: 'كود المتابعة',
                submit: 'ربط',
                back: '← العودة للرئيسية',
                success: 'تم الربط بنجاح! يمكنك الآن رؤية بيانات المريض.',
                errorRequired: 'يرجى ملء جميع الحقول.',
                errorInvalid: 'كود المتابعة غير صحيح أو منتهي الصلاحية.',
                errorServer: 'حدث خطأ في الخادم، يرجى المحاولة لاحقًا.',
                patientDataTitle: 'بيانات المريض',
                pdName: 'الاسم:',
                pdAge: 'العمر:',
                pdGender: 'الجنس:',
                pdMed: 'العلاج:',
                pdPhone: 'الهاتف:',
                pdBlood: 'فصيلة الدم:',
                pdAddress: 'العنوان:',
                alreadyLinked: 'أنت متابع بالفعل لهذا المريض.'
            },
            en: {
                title: 'Follow Patient - Sanad | سَنَد',
                subhead: 'Enter your details and follow code to link with a patient',
                name: 'Full Name',
                phone: 'Phone Number',
                code: 'Follow Code',
                submit: 'Link',
                back: '← Back to Home',
                success: 'Successfully linked! You can now see patient data.',
                errorRequired: 'Please fill in all fields.',
                errorInvalid: 'Invalid or expired follow code.',
                errorServer: 'Server error, please try again later.',
                patientDataTitle: 'Patient Data',
                pdName: 'Name:',
                pdAge: 'Age:',
                pdGender: 'Gender:',
                pdMed: 'Medication:',
                pdPhone: 'Phone:',
                pdBlood: 'Blood Type:',
                pdAddress: 'Address:',
                alreadyLinked: 'You are already following this patient.'
            }
        };

        // =============================================
        // DOM REFS
        // =============================================
        const html = document.documentElement;
        const body = document.body;
        const langBtns = document.querySelectorAll('.lang-btn');
        const form = document.getElementById('followForm');
        const fullName = document.getElementById('fullName');
        const phone = document.getElementById('phone');
        const followCode = document.getElementById('followCode');
        const submitBtn = document.getElementById('submitBtn');
        const message = document.getElementById('message');
        const patientData = document.getElementById('patientData');
        const backLink = document.getElementById('backLink');

        // =============================================
        // LANGUAGE
        // =============================================
        function getStoredLang() {
            return localStorage.getItem('sanad-lang') || 'ar';
        }

        function setStoredLang(lang) {
            localStorage.setItem('sanad-lang', lang);
        }

        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;

            document.title = t.title;
            document.getElementById('subhead').textContent = t.subhead;
            document.getElementById('nameLabel').textContent = t.name;
            document.getElementById('phoneLabel').textContent = t.phone;
            document.getElementById('codeLabel').textContent = t.code;
            submitBtn.textContent = t.submit;
            backLink.textContent = t.back;
            document.getElementById('patientDataTitle').textContent = t.patientDataTitle;
            document.getElementById('pdNameLabel').textContent = t.pdName;
            document.getElementById('pdAgeLabel').textContent = t.pdAge;
            document.getElementById('pdGenderLabel').textContent = t.pdGender;
            document.getElementById('pdMedLabel').textContent = t.pdMed;
            document.getElementById('pdPhoneLabel').textContent = t.pdPhone;
            document.getElementById('pdBloodLabel').textContent = t.pdBlood;
            document.getElementById('pdAddressLabel').textContent = t.pdAddress;

            if (lang === 'ar') {
                html.lang = 'ar';
                body.className = 'ar';
                html.dir = 'rtl';
            } else {
                html.lang = 'en';
                body.className = 'en';
                html.dir = 'ltr';
            }

            langBtns.forEach(btn => {
                const isActive = btn.dataset.lang === lang;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });

            setStoredLang(lang);
            message.textContent = '';
            message.className = 'message';
        }

        langBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                applyLanguage(this.dataset.lang);
            });
        });

        // =============================================
        // FORM SUBMISSION
        // =============================================
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const lang = getStoredLang();
            const t = translations[lang];

            const name = fullName.value.trim();
            const phoneVal = phone.value.trim();
            const code = followCode.value.trim().toUpperCase();

            if (!name || !phoneVal || !code) {
                message.textContent = t.errorRequired;
                message.className = 'message message-error';
                patientData.classList.remove('visible');
                return;
            }

            message.textContent = '...';
            message.className = 'message';

            try {
                const res = await fetch('/api/follow/link', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name,
                        phone: phoneVal,
                        followCode: code,
                        lang
                    })
                });

                const data = await res.json();

                if (!res.ok) {
                    message.textContent = data.error || t.errorInvalid;
                    message.className = 'message message-error';
                    patientData.classList.remove('visible');
                    return;
                }

                // Success
                message.textContent = t.success;
                message.className = 'message message-success';
                if (data.patientName) {
                    document.getElementById('pdName').textContent = data.patientName;
                    document.getElementById('pdAge').textContent = '—';
                    document.getElementById('pdGender').textContent = '—';
                    document.getElementById('pdMed').textContent = '—';
                    document.getElementById('pdPhone').textContent = '—';
                    document.getElementById('pdBlood').textContent = '—';
                    document.getElementById('pdAddress').textContent = '—';
                    patientData.classList.add('visible');
                } else {
                    patientData.classList.remove('visible');
                }

                // Clear form
                form.reset();

            } catch (error) {
                console.error('Follow error:', error);
                message.textContent = t.errorServer;
                message.className = 'message message-error';
                patientData.classList.remove('visible');
            }
        });

        // =============================================
        // INIT
        // =============================================
        applyLanguage(getStoredLang());
    </script>
</body>
</html>
