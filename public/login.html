<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المشرف - سَنَد | Sanad</title>
    <link rel="icon" type="image/jpeg" href="https://i.postimg.cc/9QK3SShV/Icon-Logo.jpg">
    <style>
        /* نفس الـ styles المستخدمة في index مع بعض التعديلات */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            transition: all 0.3s ease;
        }

        body.en {
            direction: ltr;
        }
        body.ar {
            direction: rtl;
        }

        .container {
            max-width: 440px;
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 32px;
            padding: 40px 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
            text-align: center;
        }

        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            margin-bottom: 24px;
        }

        .brand-logo {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }

        .brand-name {
            font-size: 2rem;
            font-weight: 700;
            color: #1a2a3a;
        }
        .brand-name span {
            color: #d32f2f;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: start;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #1a2a3a;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #d1d9e6;
            border-radius: 16px;
            font-size: 1rem;
            transition: border 0.2s;
            background: #f8fafc;
        }

        input:focus {
            outline: none;
            border-color: #2c3e50;
            box-shadow: 0 0 0 4px rgba(44, 62, 80, 0.1);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #1a2a3a;
            color: white;
            min-height: 56px;
        }

        .btn:hover {
            background: #0f1a24;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(26, 42, 58, 0.3);
        }

        .error-msg {
            color: #d32f2f;
            font-weight: 500;
            margin-top: 12px;
            min-height: 28px;
        }

        .lang-toggle {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .lang-btn {
            background: none;
            border: 2px solid #d1d9e6;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #4a5b6b;
        }

        .lang-btn.active {
            background: #1a2a3a;
            color: white;
            border-color: #1a2a3a;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #4a5b6b;
            text-decoration: none;
            font-weight: 500;
        }
        .back-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .container {
                padding: 24px 16px;
            }
            .brand-name {
                font-size: 1.6rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Brand -->
        <div class="brand">
            <img src="https://i.postimg.cc/k4P0MbGy/Primary-Logo.jpg" alt="Sanad Logo" class="brand-logo">
            <h1 class="brand-name">سَنَد <span>|</span> Sanad</h1>
        </div>

        <!-- Language Toggle -->
        <div class="lang-toggle" role="group" aria-label="Language selector">
            <button class="lang-btn active" data-lang="ar" aria-pressed="true">العربية</button>
            <button class="lang-btn" data-lang="en" aria-pressed="false">English</button>
        </div>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <input type="hidden" id="csrfToken" name="_csrf">

            <div class="form-group">
                <label id="usernameLabel">اسم المستخدم</label>
                <input type="text" id="username" name="username" required autocomplete="username" aria-required="true">
            </div>

            <div class="form-group">
                <label id="passwordLabel">كلمة المرور</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" aria-required="true">
            </div>

            <button type="submit" class="btn" id="loginBtn">دخول</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <a href="/" class="back-link" id="backLink">← العودة للرئيسية</a>
    </div>

    <script>
        // ===== TRANSLATIONS =====
        const translations = {
            ar: {
                title: 'دخول المشرف - سَنَد | Sanad',
                username: 'اسم المستخدم',
                password: 'كلمة المرور',
                login: 'دخول',
                back: '← العودة للرئيسية',
                errorInvalid: 'اسم المستخدم أو كلمة المرور غير صحيحة.',
                errorRequired: 'يرجى ملء جميع الحقول.',
                errorServer: 'حدث خطأ في الخادم، يرجى المحاولة لاحقًا.'
            },
            en: {
                title: 'Admin Login - Sanad | سَنَد',
                username: 'Username',
                password: 'Password',
                login: 'Login',
                back: '← Back to Home',
                errorInvalid: 'Invalid username or password.',
                errorRequired: 'Please fill in all fields.',
                errorServer: 'Server error, please try again later.'
            }
        };

        // ===== DOM REFS =====
        const html = document.documentElement;
        const body = document.body;
        const langBtns = document.querySelectorAll('.lang-btn');
        const usernameLabel = document.getElementById('usernameLabel');
        const passwordLabel = document.getElementById('passwordLabel');
        const loginBtn = document.getElementById('loginBtn');
        const backLink = document.getElementById('backLink');
        const errorMsg = document.getElementById('errorMsg');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const form = document.getElementById('loginForm');

        // ===== LANGUAGE PERSISTENCE =====
        function getStoredLang() {
            return localStorage.getItem('sanad-lang') || 'ar';
        }

        function setStoredLang(lang) {
            localStorage.setItem('sanad-lang', lang);
        }

        // ===== APPLY LANGUAGE =====
        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;

            document.title = t.title;
            usernameLabel.textContent = t.username;
            passwordLabel.textContent = t.password;
            loginBtn.textContent = t.login;
            backLink.textContent = t.back;

            if (lang === 'ar') {
                html.lang = 'ar';
                body.className = 'ar';
                html.dir = 'rtl';
            } else {
                html.lang = 'en';
                body.className = 'en';
                html.dir = 'ltr';
            }

            langBtns.forEach(btn => {
                const isActive = btn.dataset.lang === lang;
                btn.classList.toggle('active', isActive);
                btn.setAttribute('aria-pressed', isActive ? 'true' : 'false');
            });

            setStoredLang(lang);
            errorMsg.textContent = '';
        }

        // ===== LANGUAGE EVENTS =====
        langBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                applyLanguage(this.dataset.lang);
            });
        });

        // ===== CSRF TOKEN =====
        async function fetchCsrfToken() {
            try {
                const res = await fetch('/api/csrf-token');
                const data = await res.json();
                document.getElementById('csrfToken').value = data.csrfToken;
            } catch (e) {
                console.error('Failed to fetch CSRF token');
            }
        }
        fetchCsrfToken();

        // ===== FORM SUBMISSION =====
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const lang = getStoredLang();
            const t = translations[lang];

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                errorMsg.textContent = t.errorRequired;
                return;
            }

            errorMsg.textContent = '';

            try {
                const res = await fetch('/api/auth/admin-login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'CSRF-Token': document.getElementById('csrfToken').value
                    },
                    body: JSON.stringify({ username, password, lang })
                });

                const data = await res.json();

                if (!res.ok) {
                    errorMsg.textContent = data.error || t.errorInvalid;
                    return;
                }

                // Success - redirect to dashboard
                window.location.href = '/dashboard.html';

            } catch (error) {
                console.error('Login error:', error);
                errorMsg.textContent = t.errorServer;
            }
        });

        // ===== INIT =====
        applyLanguage(getStoredLang());
    </script>
</body>
</html>
